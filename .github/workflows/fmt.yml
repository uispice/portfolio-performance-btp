name: Fmt

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7

      - name: Build
        run: go build -o securities-fmt ./cmd/securities-fmt

      - name: Format securities.csv
        run: ./securities-fmt -w

      # Su main/push il fix viene committato automaticamente: nessun intervento locale richiesto.
      - name: Commit formatted securities.csv
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- securities.csv; then
            echo "✅ securities.csv already formatted"
            exit 0
          fi

          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add securities.csv
          git commit -m "chore: format securities.csv"
          git push

      # Nelle PR resta il controllo stretto: il file deve essere gia' formattato.
      - name: Check securities.csv format
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- securities.csv
